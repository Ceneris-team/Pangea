services:
  db:
    image: postgres:16
    environment:
      # Debe coincidir con el fallback de app/database.py y con .env.example,
      # para que "docker-compose up -d" + "cp .env.example .env" funcione
      # sin ajustes en una máquina nueva.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pangea_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build: ./backend
    profiles: ["full"]
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql+psycopg2://pangea:pangea_dev@db:5432/pangea_dev
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/3
      RATELIMIT_STORAGE_URL: redis://redis:6379/1
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      - db
      - redis

  worker:
    build: ./backend
    profiles: ["full"]
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql+psycopg2://pangea:pangea_dev@db:5432/pangea_dev
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/3
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4
    restart: unless-stopped
    depends_on:
      - db
      - redis

  beat:
    build: ./backend
    profiles: ["full"]
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql+psycopg2://pangea:pangea_dev@db:5432/pangea_dev
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/3
    command: celery -A app.core.celery_app beat --loglevel=info
    restart: unless-stopped
    depends_on:
      - db
      - redis

volumes:
  pgdata: