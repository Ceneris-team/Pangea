services:
  db:
    image: postgres:16
    environment:
      # Debe coincidir con el fallback de app/database.py y con .env.example,
      # para que "docker-compose up -d" + "cp .env.example .env" funcione
      # sin ajustes en una máquina nueva.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pangea_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata: