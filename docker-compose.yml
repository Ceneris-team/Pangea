services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pangea
      POSTGRES_PASSWORD: pangea_dev
      POSTGRES_DB: pangea_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: ./backend
    profiles: ["full"]
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql+psycopg2://pangea:pangea_dev@db:5432/pangea_dev
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/3
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  worker:
    build: ./backend
    profiles: ["full"]
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql+psycopg2://pangea:pangea_dev@db:5432/pangea_dev
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/3
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4
    depends_on:
      - db
      - redis

  beat:
    build: ./backend
    profiles: ["full"]
    env_file:
      - ./.env
    environment:
      DATABASE_URL: postgresql+psycopg2://pangea:pangea_dev@db:5432/pangea_dev
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/3
    command: celery -A app.core.celery_app beat --loglevel=info
    depends_on:
      - db
      - redis

volumes:
  pgdata: